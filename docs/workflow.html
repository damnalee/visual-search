<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Search Workflow</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2430;
    --muted: #5b6475;
    --card: #f4f6fb;
    --line: #aeb6c6;
    --border: #d5dae6;
    --accent: #4f46e5;
    --accent-soft: #e0e7ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a;
      --fg: #e8eaf0;
      --muted: #9aa3b5;
      --card: #1c202b;
      --line: #4a5266;
      --border: #333a4d;
      --accent: #818cf8;
      --accent-soft: #2a2f55;
    }
  }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 16px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .spacer { flex: 1; }
  .diagram {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px;
  }
  svg { width: 100%; height: auto; display: block; }
  .arrowhead { fill: var(--line); }
  .edge { stroke: var(--line); stroke-width: 2; fill: none; marker-end: url(#arrow); transition: stroke 0.25s; }
  .edge.lit { stroke: var(--accent); stroke-width: 3; }
  .edge-label { fill: var(--muted); font-size: 11px; text-anchor: middle; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; transition: all 0.25s; }
  .node text { fill: var(--fg); font-size: 13px; pointer-events: none; }
  .node text.small { fill: var(--muted); font-size: 11px; }
  .node:hover rect, .node:focus rect, .node.selected rect { stroke: var(--accent); stroke-width: 2.5; }
  .node.lit rect { fill: var(--accent-soft); stroke: var(--accent); }
  .detail {
    margin-top: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .detail h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .detail p { margin: 6px 0; line-height: 1.5; }
  .detail .muted { color: var(--muted); }
  code { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
</style>
</head>
<body>
  <h1>Visual Search: workflow</h1>
  <p class="sub">Click a box for details. Press Animate to follow the data flow.</p>

  <div class="toolbar">
    <div id="tabs" class="toolbar" style="margin:0"></div>
    <span class="spacer"></span>
    <button id="animate">Animate</button>
    <button id="reset">Reset</button>
  </div>

  <div class="diagram"><svg id="svg" role="img" aria-label="Workflow diagram"></svg></div>

  <div class="detail">
    <h2 id="d-title"></h2>
    <p id="d-text"></p>
    <p><strong>Code:</strong> <code id="d-code"></code></p>
    <p id="d-notes" class="muted"></p>
  </div>

<script>
  var FLOWS = {
    search: {
      title: "Online: answering a search",
      back: "JSON results",
      nodes: [
        {
          id: "client", label: "Flutter client", sub: "text or photo",
          text: "Text box, photo picker (gallery or camera) and an optional color dropdown. State is managed with Provider. Shows loading, empty and error states.",
          code: "flutter_app/lib/",
          notes: "Client timeout is 20 s. Network failures show a readable message instead of crashing."
        },
        {
          id: "api", label: "FastAPI", sub: "validate + timeout",
          text: "Two endpoints: /search/text and /search/image. Validates input (400), limits uploads to 5 MB (413), and runs inference in a thread pool under a 15 s limit (504).",
          code: "app/main.py",
          notes: "CORS is open for development. Restrict it to the real frontend origin in production."
        },
        {
          id: "clip", label: "CLIP encoder", sub: "query to vector",
          text: "openai/clip-vit-base-patch32 turns the query text or image into a normalized 512-dimension vector. Runs on MPS, CUDA or CPU.",
          code: "embed_text(), embed_image()",
          notes: "Text and image share one embedding space, which is what makes text-to-image search work."
        },
        {
          id: "chroma", label: "ChromaDB", sub: "cosine search",
          text: "Nearest-neighbor search over the product embeddings. An optional metadata filter restricts results to one color. Returns top_k items with distances.",
          code: "search()",
          notes: "Color filter exists because CLIP weights object meaning more than color."
        },
        {
          id: "filter", label: "Threshold filter", sub: "adaptive cut-off",
          text: "Score = 1 - cosine distance. Keeps results with score >= max(floor, best score - margin). Text: floor 0.18, margin 0.05. Image: floor 0.50, margin 0.10.",
          code: "filter_results()",
          notes: "Text and image use different floors because CLIP text-to-image similarities are much lower than image-to-image ones."
        }
      ],
      edges: [
        { label: "HTTP" },
        { label: "query" },
        { label: "vector" },
        { label: "top_k" }
      ]
    },
    index: {
      title: "Offline: building the index",
      back: null,
      nodes: [
        {
          id: "data", label: "Dataset", sub: "images + styles.csv",
          text: "Fashion Product Images (Small) from Kaggle. A random sample of 8,000 products (seed 42) is indexed.",
          code: "data/fashion/",
          notes: "The dataset is not committed to Git. Download it from Kaggle."
        },
        {
          id: "ingest", label: "ingest.py", sub: "batches of 32",
          text: "Reads the CSV, keeps rows whose image file exists, samples 8,000, opens images in batches and collects metadata (name, category, article type, color).",
          code: "scripts/ingest.py",
          notes: "Uses upsert, so re-running does not create duplicates."
        },
        {
          id: "iclip", label: "CLIP encoder", sub: "image to vector",
          text: "Each batch goes through the CLIP image encoder. Vectors are L2-normalized so cosine similarity works as a dot product.",
          code: "model.get_image_features()",
          notes: "Runs on the Apple GPU (MPS) when available."
        },
        {
          id: "ichroma", label: "ChromaDB", sub: "persistent store",
          text: "Stores ids, embeddings and metadata in a persistent collection named products, using cosine space.",
          code: "chroma_db/",
          notes: "Folder is git-ignored. Rebuild it with ingest.py."
        }
      ],
      edges: [
        { label: "images + CSV" },
        { label: "batch" },
        { label: "vectors" }
      ]
    }
  };

  var SVG_NS = "http://www.w3.org/2000/svg";
  var VIEW_W = 1000, VIEW_H = 220, NODE_W = 130, NODE_H = 70, NODE_Y = 50, MARGIN = 20;
  var svg = document.getElementById("svg");
  var current = "search";
  var timers = [];

  function el(name, attrs, parent) {
    var e = document.createElementNS(SVG_NS, name);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    if (parent) { parent.appendChild(e); }
    return e;
  }

  function stopAnimation() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function clearLit() {
    document.querySelectorAll(".lit").forEach(function (e) { e.classList.remove("lit"); });
  }

  function select(id) {
    var node = FLOWS[current].nodes.find(function (n) { return n.id === id; });
    document.querySelectorAll(".node").forEach(function (g) { g.classList.remove("selected"); });
    document.getElementById("node-" + id).classList.add("selected");
    document.getElementById("d-title").textContent = node.label;
    document.getElementById("d-text").textContent = node.text;
    document.getElementById("d-code").textContent = node.code;
    document.getElementById("d-notes").textContent = node.notes;
  }

  function render(key) {
    stopAnimation();
    current = key;
    var flow = FLOWS[key];
    svg.innerHTML = "";
    svg.setAttribute("viewBox", "0 0 " + VIEW_W + " " + VIEW_H);

    var defs = el("defs", {}, svg);
    var marker = el("marker", {
      id: "arrow", viewBox: "0 0 10 10", refX: "9", refY: "5",
      markerWidth: "7", markerHeight: "7", orient: "auto"
    }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", "class": "arrowhead" }, marker);

    var n = flow.nodes.length;
    var gap = (VIEW_W - 2 * MARGIN - n * NODE_W) / (n - 1);
    var pos = {};
    flow.nodes.forEach(function (node, i) { pos[node.id] = MARGIN + i * (NODE_W + gap); });

    var midY = NODE_Y + NODE_H / 2;
    flow.edges.forEach(function (edge, i) {
      var from = flow.nodes[i].id;
      var to = flow.nodes[i + 1].id;
      var x1 = pos[from] + NODE_W;
      var x2 = pos[to] - 4;
      el("path", { d: "M" + x1 + "," + midY + " L" + x2 + "," + midY, "class": "edge", id: "edge-" + i }, svg);
      var label = el("text", { x: (x1 + x2) / 2, y: midY - 8, "class": "edge-label" }, svg);
      label.textContent = edge.label;
    });

    if (flow.back) {
      var last = pos[flow.nodes[n - 1].id] + NODE_W / 2;
      var first = pos[flow.nodes[0].id] + NODE_W / 2;
      var yb = NODE_Y + NODE_H;
      el("path", {
        d: "M" + last + "," + yb + " V" + (yb + 50) + " H" + first + " V" + (yb + 4),
        "class": "edge", id: "edge-back"
      }, svg);
      var backLabel = el("text", { x: (first + last) / 2, y: yb + 42, "class": "edge-label" }, svg);
      backLabel.textContent = flow.back;
    }

    flow.nodes.forEach(function (node) {
      var g = el("g", {
        "class": "node", id: "node-" + node.id, tabindex: "0",
        role: "button", "aria-label": node.label
      }, svg);
      el("rect", { x: pos[node.id], y: NODE_Y, width: NODE_W, height: NODE_H, rx: 10 }, g);
      var cx = pos[node.id] + NODE_W / 2;
      var t1 = el("text", { x: cx, y: NODE_Y + 30, "text-anchor": "middle" }, g);
      t1.textContent = node.label;
      var t2 = el("text", { x: cx, y: NODE_Y + 50, "text-anchor": "middle", "class": "small" }, g);
      t2.textContent = node.sub;
      g.addEventListener("click", function () { select(node.id); });
      g.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(node.id); }
      });
    });

    document.querySelectorAll("#tabs button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.key === key);
    });
    select(flow.nodes[0].id);
  }

  function animate() {
    stopAnimation();
    clearLit();
    var flow = FLOWS[current];
    var steps = [];
    flow.nodes.forEach(function (node, i) {
      steps.push("node-" + node.id);
      if (i < flow.edges.length) { steps.push("edge-" + i); }
    });
    if (flow.back) { steps.push("edge-back"); }
    steps.forEach(function (id, i) {
      timers.push(setTimeout(function () {
        document.getElementById(id).classList.add("lit");
      }, i * 600));
    });
  }

  var tabs = document.getElementById("tabs");
  Object.keys(FLOWS).forEach(function (key) {
    var b = document.createElement("button");
    b.textContent = FLOWS[key].title;
    b.dataset.key = key;
    b.addEventListener("click", function () { render(key); });
    tabs.appendChild(b);
  });

  document.getElementById("animate").addEventListener("click", animate);
  document.getElementById("reset").addEventListener("click", function () {
    stopAnimation();
    clearLit();
  });

  render("search");
</script>
</body>
</html>
